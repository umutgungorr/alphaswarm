[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaswarm"
version = "0.1.0"
description = "⚡ Autonomous Multi-Agent Market Intelligence Hub & Consensus Graph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["multi-agent", "trading", "finance", "consensus", "llm", "quant", "crypto", "stocks", "market-intelligence"]
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
alphaswarm = "alphaswarm.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
